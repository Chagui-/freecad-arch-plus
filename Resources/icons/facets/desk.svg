     fill="none" stroke="currentColor" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
  <line x1="3" y1="8" x2="21" y2="8"/>
  <line x1="4" y1="8" x2="4" y2="19"/>
  <rect x="15" y="8" width="6" height="7" rx="0.5"/>
</svg>
