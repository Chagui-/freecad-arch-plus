<?xml version="1.0" encoding="UTF-8"?>
<!-- Table - line-art tabletop on 2 legs, single stroke colour (currentColor). See bathroom.svg for the shared style notes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="5" width="18" height="2" rx="0.7"/>
  <line x1="5" y1="7" x2="5" y2="20"/>
  <line x1="19" y1="7" x2="19" y2="20"/>
</svg>
