<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- wall block -->
  <g fill="none" stroke="#1a5fb4" stroke-width="3" stroke-linejoin="round">
    <rect x="8" y="8" width="48" height="48" rx="1" fill="#cfe3ff"/>
  </g>
  <!-- brick coursing: running bond, thin blue joints -->
  <g stroke="#1a5fb4" stroke-width="1.5">
    <line x1="8" y1="20" x2="56" y2="20"/>
    <line x1="8" y1="32" x2="56" y2="32"/>
    <line x1="8" y1="44" x2="56" y2="44"/>
    <line x1="24" y1="8" x2="24" y2="20"/>
    <line x1="40" y1="8" x2="40" y2="20"/>
    <line x1="16" y1="20" x2="16" y2="32"/>
    <line x1="32" y1="20" x2="32" y2="32"/>
    <line x1="48" y1="20" x2="48" y2="32"/>
    <line x1="24" y1="32" x2="24" y2="44"/>
    <line x1="40" y1="32" x2="40" y2="44"/>
    <line x1="16" y1="44" x2="16" y2="56"/>
    <line x1="32" y1="44" x2="32" y2="56"/>
    <line x1="48" y1="44" x2="48" y2="56"/>
  </g>
  <!-- one brick picked out, the tool's green accent -->
  <rect x="16" y="20" width="16" height="12" fill="#2ec27e" stroke="#1a5fb4" stroke-width="1.5"/>
</svg>
