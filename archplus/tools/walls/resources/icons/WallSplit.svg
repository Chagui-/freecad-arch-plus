<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- two wall pieces split apart from one wall -->
  <g fill="none" stroke="#1a5fb4" stroke-width="3" stroke-linejoin="round">
    <rect x="4" y="10" width="24" height="44" rx="1" fill="#cfe3ff"/>
    <rect x="36" y="10" width="24" height="44" rx="1" fill="#cfe3ff"/>
  </g>
  <!-- coursing on both pieces -->
  <g stroke="#1a5fb4" stroke-width="1.5">
    <line x1="4" y1="25" x2="28" y2="25"/>
    <line x1="4" y1="40" x2="28" y2="40"/>
    <line x1="16" y1="10" x2="16" y2="25"/>
    <line x1="22" y1="25" x2="22" y2="40"/>
    <line x1="14" y1="40" x2="14" y2="54"/>
    <line x1="36" y1="25" x2="60" y2="25"/>
    <line x1="36" y1="40" x2="60" y2="40"/>
    <line x1="48" y1="10" x2="48" y2="25"/>
    <line x1="42" y1="25" x2="42" y2="40"/>
    <line x1="50" y1="40" x2="50" y2="54"/>
  </g>
  <!-- the split seam, the tool's green accent -->
  <line x1="32" y1="5" x2="32" y2="59" stroke="#2ec27e" stroke-width="3" stroke-dasharray="6 5"/>
</svg>
