<?xml version="1.0" encoding="UTF-8"?>
<!-- Nightstand - line-art small cabinet with a drawer, single stroke colour (currentColor). See bathroom.svg for the shared style notes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
  <rect x="5" y="6" width="14" height="15" rx="1"/>
  <line x1="5" y1="13" x2="19" y2="13"/>
  <circle cx="12" cy="9.5" r="0.7" fill="currentColor" stroke="none"/>
  <circle cx="12" cy="17" r="0.7" fill="currentColor" stroke="none"/>
</svg>
