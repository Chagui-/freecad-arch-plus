<?xml version="1.0" encoding="UTF-8"?>
<!-- Wardrobe - line-art double-door cabinet, single stroke colour (currentColor). See bathroom.svg for the shared style notes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="3" width="16" height="18" rx="1"/>
  <line x1="12" y1="3" x2="12" y2="21"/>
  <circle cx="10.5" cy="12" r="0.7" fill="currentColor" stroke="none"/>
  <circle cx="13.5" cy="12" r="0.7" fill="currentColor" stroke="none"/>
</svg>
